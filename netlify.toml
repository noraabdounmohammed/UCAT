[build]
  command = "mkdir -p dist && printf '<!doctype html><html><body><h1>Netlify diagnostic passed</h1></body></html>' > dist/index.html"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--omit=dev"
  SECRETS_SCAN_OMIT_KEYS = "VITE_SUPABASE_URL,VITE_SUPABASE_ANON_KEY"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
