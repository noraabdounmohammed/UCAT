<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="stylesheet" href="/practice-builder-polish.css" />
    <link rel="stylesheet" href="/studyedit-session-polish.css" />
    <script defer src="/studyedit-session-polish.js"></script>
    <script defer src="/studyedit-continuous-intro.js"></script>
    <script defer src="/studyedit-quiet-navbar.js"></script>
    
    <!-- Viewport for mobile. Resize the app surface, rather than panning the whole page, when the keyboard opens. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#1c1917" />
    <meta name="color-scheme" content="light dark" />
    <meta name="supported-color-schemes" content="light dark" />
    <meta name="description" content="AI-powered medical education platform for UKMLA and medical exam preparation" />
    
    <!-- Open Graph / Link Preview -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://studyedit.com" />
    <meta property="og:title" content="Study Edit" />
    <meta property="og:description" content="AI-powered medical education platform for UKMLA and medical exam preparation" />
    <meta property="og:site_name" content="Study Edit" />
    
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Study Edit" />
    <meta name="twitter:description" content="AI-powered medical education platform for UKMLA and medical exam preparation" />
    
    <!-- iOS Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Study Edit" />
    
    <!-- Android Meta Tags -->
    <meta name="mobile-web-app-capable" content="yes" />
    
    <title>Study Edit - Medical Education Platform</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
