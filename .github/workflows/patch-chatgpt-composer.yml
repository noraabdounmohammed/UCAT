name: Patch ChatGPT-style tutor composer
on:
  push:
    paths:
      - '.github/workflows/patch-chatgpt-composer.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch composer safely
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/components/practice/UkmlaSBAQuestion.tsx')
          s=p.read_text()
          s=s.replace('const inputRef = useRef<HTMLInputElement | null>(null);','const inputRef = useRef<HTMLTextAreaElement | null>(null);')
          old='''<form className="mt-7 flex items-center gap-2 rounded-[18px] border bg-[#FFFDF8] p-2 pl-4 shadow-[0_8px_24px_rgba(31,20,12,0.04)]" style={{ borderColor: '#DCCDB8' }} onSubmit={event => {\n                    event.preventDefault();\n                    const query = aiQuestion.trim();\n                    if (query) void handleStudentReply(query);\n                  }}>\n                    <input\n                      ref={inputRef}\n                      value={aiQuestion}\n                      onChange={event => setAiQuestion(event.target.value)}\n                      disabled={tutorBusy}\n                      placeholder={tutorBusy ? 'StudyEdit is thinking…' : 'Reply or ask anything…'}\n                      className="min-w-0 flex-1 bg-transparent py-2.5 text-[16px] font-medium outline-none placeholder:text-[#A89582] disabled:cursor-wait"\n                      style={{ color: C.espresso }}\n                    />'''
          new='''<form className="mt-7 flex items-end gap-2 rounded-[18px] border bg-[#FFFDF8] p-2 pl-4 shadow-[0_8px_24px_rgba(31,20,12,0.04)]" style={{ borderColor: '#DCCDB8' }} onSubmit={event => {\n                    event.preventDefault();\n                    const query = aiQuestion.trim();\n                    if (query) void handleStudentReply(query);\n                  }}>\n                    <textarea\n                      ref={inputRef}\n                      rows={1}\n                      value={aiQuestion}\n                      onChange={event => {\n                        setAiQuestion(event.target.value);\n                        event.currentTarget.style.height = 'auto';\n                        event.currentTarget.style.height = `${Math.min(event.currentTarget.scrollHeight, 180)}px`;\n                        event.currentTarget.style.overflowY = event.currentTarget.scrollHeight > 180 ? 'auto' : 'hidden';\n                      }}\n                      onKeyDown={event => {\n                        if (event.key === 'Enter' && !event.shiftKey && !event.nativeEvent.isComposing) {\n                          event.preventDefault();\n                          const query = aiQuestion.trim();\n                          if (query && !tutorBusy) void handleStudentReply(query);\n                        }\n                      }}\n                      disabled={tutorBusy}\n                      placeholder={tutorBusy ? 'StudyEdit is thinking…' : 'Reply or ask anything…'}\n                      className="min-h-[44px] max-h-[180px] min-w-0 flex-1 resize-none bg-transparent py-2.5 text-[16px] font-medium leading-6 outline-none placeholder:text-[#A89582] disabled:cursor-wait"\n                      style={{ color: C.espresso, overflowY: 'hidden' }}\n                    />'''
          if old not in s:
              raise SystemExit('Expected composer block not found; refusing unsafe patch')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/components/practice/UkmlaSBAQuestion.tsx
          git commit -m "Make tutor composer auto-expand like ChatGPT"
          git push