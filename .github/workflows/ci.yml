name: CI

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ ukmla-akt-version, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Type-check (informational; pre-existing legacy errors)
        run: npx tsc --noEmit
        continue-on-error: true
      - run: npm test
      - run: npm run build

  e2e-smoke:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/ukmla-akt-version'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          E2E_BASE_URL: https://studyedit.com

  launch-eval:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'pull_request' && github.head_ref == 'launch-eval-pilot'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Run non-destructive 20-question launch pilot
        id: launch_eval
        run: npm run eval:launch
        continue-on-error: true
        env:
          STUDYEDIT_BASE_URL: https://studyedit.com
      - name: Upload launch eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: launch-eval-report
          path: artifacts/launch-eval-report.json
          if-no-files-found: warn
      - name: Enforce launch gate
        if: steps.launch_eval.outcome == 'failure'
        run: exit 1
