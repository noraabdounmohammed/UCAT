name: CI

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ ukmla-akt-version, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Type-check (informational; pre-existing legacy errors)
        run: npx tsc --noEmit
        continue-on-error: true
      - run: npm test
      - run: npm run build

  e2e-smoke:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/ukmla-akt-version'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Exercise this commit through the mobile learner golden path
        run: npm run test:e2e -- --project=mobile-chrome
        env:
          VITE_SUPABASE_URL: https://uivitzexbtsmnspcitgh.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_FWNGF1ytdxGbG1RoOiAzJA_tH6NF8Wg
      - name: Check current production for gross regressions
        continue-on-error: true
        run: npx playwright test tests/e2e/stability.spec.ts --project=mobile-chrome
        env:
          E2E_BASE_URL: https://studyedit.com

  launch-eval:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'pull_request' && github.head_ref == 'launch-eval-pilot'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Run launch pilot attempt 1
        run: |
          npm run eval:launch || true
          mv artifacts/launch-eval-report.json artifacts/launch-eval-attempt-1.json
        env:
          STUDYEDIT_BASE_URL: https://studyedit.com
      - name: Run launch pilot attempt 2
        run: |
          npm run eval:launch || true
          mv artifacts/launch-eval-report.json artifacts/launch-eval-attempt-2.json
        env:
          STUDYEDIT_BASE_URL: https://studyedit.com
      - name: Combine attempts using production acceptance rule
        id: launch_eval
        run: node scripts/combine-launch-eval-attempts.mjs
        continue-on-error: true
      - name: Upload launch eval reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: launch-eval-report
          path: |
            artifacts/launch-eval-report.json
            artifacts/launch-eval-attempt-1.json
            artifacts/launch-eval-attempt-2.json
          if-no-files-found: warn
      - name: Enforce launch gate
        if: steps.launch_eval.outcome == 'failure'
        run: exit 1
