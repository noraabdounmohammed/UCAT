name: Patch tutor output hardening

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/patch-tutor-output.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Harden StudyEdit tutor output
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/services/openai.ts')
          s = p.read_text()

          old_policy = """- Prefer the shortest explanation that changes this learner's future decision-making.\\n- Never expose internal scores, mastery levels, storage fields, event IDs, fingerprints or system terminology to the learner.\\n- Keep the answer concise and action-oriented.`;"""
          new_policy = """- Prefer the shortest explanation that changes this learner's future decision-making.\\n- Never expose internal scores, mastery levels, storage fields, event IDs, fingerprints or system terminology to the learner.\\nn- For visible tutor replies, make exactly ONE teaching move. Usually use 1-3 short sentences. Never give an unsolicited option-by-option review.\\n- If you ask a Quick check, it must be ONE free-text question. Do not create A/B/C/D/E options or partial answer lists inside a tutor reply.\\n- Never say the learner has made this mistake before, has a recurring pattern, or has a history of an error unless multiple explicit memory observations in LONGITUDINAL LEARNER MEMORY support that exact claim. Prefer not to mention history at all unless it materially improves the teaching move.\\n- Finish every visible reply cleanly. Never end on a heading, colon, conjunction, option label, or unfinished sentence.\\n- Keep the answer concise and action-oriented.`;""".replace('\\n- For visible', '\\n- For visible')
          if old_policy not in s:
              raise SystemExit('Teaching policy anchor not found')
          s = s.replace(old_policy, new_policy)

          old_system = """- Use light markdown only when it improves skimming.\n- Do not use motivational filler, emojis or generic AI preambles.\n- If the supplied information is insufficient, say so briefly.`;"""
          new_system = """- Use light markdown only when it improves skimming.\n- Visible tutor replies are conversational turns, not mini-essays: make one teaching move, normally 1-3 short sentences.\n- Never produce an unsolicited option-by-option explanation.\n- A Quick check must be one free-text question only; never invent A/B/C/D/E choices in tutor conversation.\n- Never claim the learner has made an error before or has a recurring pattern unless multiple explicit memory observations supplied in this request prove that exact claim.\n- Always finish the reply cleanly; never end mid-heading, mid-list or mid-sentence.\n- Do not use motivational filler, emojis, dramatic language or generic AI preambles.\n- If the supplied information is insufficient, say so briefly.`;"""
          if old_system not in s:
              raise SystemExit('System prompt anchor not found')
          s = s.replace(old_system, new_system)

          insert_anchor = """let openai: OpenAI | null = null;"""
          guard = r'''
function isInvalidTutorOutput(text: string): boolean {
  const clean = String(text || '').trim();
  if (!clean) return true;
  if (clean.length > 900) return true;
  if (/your history|same .*error.*before|you(?:'ve| have) (?:made|chosen|missed|confused).*before/i.test(clean)) return true;
  if (/(?:^|\n)\s*(?:[-*•]\s*)?[A-E][.)]\s*$/m.test(clean)) return true;
  if (/Quick check[\s\S]*(?:\n|^)\s*(?:[-*•]\s*)?[A-E][.)]\s+/i.test(clean)) return true;
  if (/\b(?:Why|Because|And|But|So|Then|Which|What|How)\s*$/i.test(clean)) return true;
  if (!/[.!?][\s\"'”’)*_]*$/.test(clean)) return true;
  return false;
}

function conciseTutorFallback(context: QuestionContext): string {
  const grounding = String(context.explanation || '').replace(/\s+/g, ' ').trim();
  const firstTwo = grounding.match(/[^.!?]+[.!?]+/g)?.slice(0, 2).join(' ').trim() || grounding;
  const correct = context.correctAnswer ? `The correct answer is **${context.correctAnswer}**. ` : '';
  const teaching = firstTwo || 'Use the decisive clinical clue in the case to choose the management step.';
  return `${correct}${teaching}`.trim();
}

async function repairTutorOutput(
  userQuery: string,
  context: QuestionContext,
  learnerName: string | null,
  draft: string,
): Promise<string> {
  if (!openai) return conciseTutorFallback(context);
  try {
    const response = await openai.chat.completions.create({
      model: 'deepseek-chat',
      messages: [
        {
          role: 'system',
          content: `You are repairing a StudyEdit tutor turn before it is shown to a medical student. Return ONLY the repaired learner-facing turn. Use the supplied clinical context as ground truth. Make exactly one pedagogical move in 1-3 short sentences. If a check is useful, ask exactly one free-text question prefixed "Quick check:". Never create multiple-choice options. Never claim prior mistakes or recurring history. Never review every option unless the learner explicitly asked. End with a complete sentence or question.`,
        },
        {
          role: 'user',
          content: `${buildUserPrompt(userQuery, context, learnerName)}\n\nDRAFT TO REPAIR:\n${draft}`,
        },
      ],
      temperature: 0.1,
      max_tokens: 160,
      top_p: 0.7,
      stream: false,
    });
    const repaired = response.choices[0]?.message?.content?.trim() || '';
    return repaired && !isInvalidTutorOutput(repaired) ? repaired : conciseTutorFallback(context);
  } catch (error) {
    console.error('Tutor repair failed:', error);
    return conciseTutorFallback(context);
  }
}

'''
          if insert_anchor not in s:
              raise SystemExit('OpenAI anchor not found')
          s = s.replace(insert_anchor, guard + insert_anchor)

          old_stream_loop = r'''    for await (const chunk of stream as AsyncIterable<{ choices: Array<{ delta?: { content?: string } }> }>) {
      if (abortSignal?.aborted) throw new Error('Request aborted');
      const delta = chunk?.choices?.[0]?.delta?.content ?? '';
      if (!delta) continue;
      fullResponse += delta;
      onToken(delta);
    }

    if (fullResponse) responseCache[cacheKey] = { response: fullResponse, timestamp: Date.now() };
    return fullResponse;'''
          new_stream_loop = r'''    for await (const chunk of stream as AsyncIterable<{ choices: Array<{ delta?: { content?: string } }> }>) {
      if (abortSignal?.aborted) throw new Error('Request aborted');
      const delta = chunk?.choices?.[0]?.delta?.content ?? '';
      if (!delta) continue;
      fullResponse += delta;
    }

    const safeResponse = isInvalidTutorOutput(fullResponse)
      ? await repairTutorOutput(userQuery, context, learnerName, fullResponse)
      : fullResponse.trim();

    if (safeResponse) {
      onToken(safeResponse);
      responseCache[cacheKey] = { response: safeResponse, timestamp: Date.now() };
    }
    return safeResponse;'''
          if old_stream_loop not in s:
              raise SystemExit('Stream loop anchor not found')
          s = s.replace(old_stream_loop, new_stream_loop)

          # Cached responses from before this patch may themselves be malformed.
          old_cached = r'''  if (cached && Date.now() - cached.timestamp < CACHE_EXPIRY_MS) {
    onStart?.();
    onToken(cached.response);
    return cached.response;
  }'''
          new_cached = r'''  if (cached && Date.now() - cached.timestamp < CACHE_EXPIRY_MS && !isInvalidTutorOutput(cached.response)) {
    onStart?.();
    onToken(cached.response);
    return cached.response;
  }'''
          if old_cached not in s:
              raise SystemExit('Stream cache anchor not found')
          s = s.replace(old_cached, new_cached, 1)

          p.write_text(s)
          PY

          git diff --check
          npm ci
          npm run build
          git config user.name 'studyedit-bot'
          git config user.email 'studyedit-bot@users.noreply.github.com'
          git add src/services/openai.ts
          git commit -m 'Harden tutor output and block malformed responses'
          git push origin HEAD:master
