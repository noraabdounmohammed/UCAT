name: Easy collapse case
on:
  push:
    paths:
      - '.github/workflows/easy-collapse-case.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make expanded case easy to collapse
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('src/components/practice/UkmlaSBAQuestion.tsx')
          s=p.read_text()
          pattern=r'<section aria-label="Question" className="animate-\[fadeIn_\.25s_ease\]">\s*<div className="mb-5 text-\[10px\] font-bold uppercase tracking-\[0\.18em\]" style=\{\{ color: C\.muted \}\}>\{conceptTitle\}</div>'
          replacement='''<section aria-label="Question" className={`animate-[fadeIn_.25s_ease] ${hasSubmitted && questionExpanded ? 'studyedit-case-expanded' : ''}`}>
              {hasSubmitted && questionExpanded ? (
                <button type="button" onClick={() => setQuestionExpanded(false)} className="studyedit-case-collapse-head flex w-full items-center gap-3 text-left" aria-label="Collapse case">
                  <span className={`studyedit-case-status ${isCorrect ? 'is-correct' : 'is-wrong'}`} aria-hidden="true">{isCorrect ? '✓' : '×'}</span>
                  <span className="studyedit-case-copy min-w-0 flex-1">
                    <span className="studyedit-case-topic block truncate">{conceptTitle}</span>
                    <span className="studyedit-case-answer block truncate">{displayedSelectedText}</span>
                  </span>
                  <ChevronDown className="studyedit-case-chevron h-5 w-5 shrink-0 rotate-180" aria-hidden="true" />
                </button>
              ) : (
                <div className="mb-5 text-[10px] font-bold uppercase tracking-[0.18em]" style={{ color: C.muted }}>{conceptTitle}</div>
              )}'''
          s,n=re.subn(pattern,replacement,s,count=1)
          if n != 1: raise SystemExit(f'question heading replacements={n}')
          hide=r'\s*\{hasSubmitted && questionExpanded && \(\s*<button type="button" onClick=\{\(\) => setQuestionExpanded\(false\)\} className="mt-5 text-\[12px\] font-semibold underline underline-offset-4" style=\{\{ color: C\.muted \}\}>\s*Hide case\s*</button>\s*\)\}'
          s,n=re.subn(hide,'',s,count=1)
          if n != 1: raise SystemExit(f'hide button replacements={n}')
          p.write_text(s)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/components/practice/UkmlaSBAQuestion.tsx
          git commit -m "Make expanded case one-tap collapsible"
          git push
