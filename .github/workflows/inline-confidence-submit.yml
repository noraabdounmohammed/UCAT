name: Inline confidence submit
on:
  push:
    paths:
      - '.github/workflows/inline-confidence-submit.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace Check answer with confidence submit
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/components/practice/UkmlaSBAQuestion.tsx')
          s = p.read_text()

          old_sig = '''    instructionOverride?: string,\n    advanceAfter = false,\n  ) => {'''
          new_sig = '''    instructionOverride?: string,\n    advanceAfter = false,\n    confidenceOverride?: ConfidenceLevel | null,\n  ) => {'''
          if old_sig not in s: raise SystemExit('runTutor signature anchor missing')
          s = s.replace(old_sig, new_sig, 1)

          old_conf = '''const confidence = confidenceLevel || await waitForConfidence(conceptTitle, startedOverride || answerStartedAt || Date.now());'''
          new_conf = '''const confidence = confidenceOverride || confidenceLevel || await waitForConfidence(conceptTitle, startedOverride || answerStartedAt || Date.now());'''
          if old_conf not in s: raise SystemExit('confidence resolution anchor missing')
          s = s.replace(old_conf, new_conf, 1)

          start = s.index('  const handleCheckAnswer = () => {')
          end = s.index('\n  };', start) + len('\n  };')
          old_handler = s[start:end]
          new_handler = '''  const handleConfidenceSubmit = (confidence: ConfidenceLevel) => {\n    if (!selectedOption || hasSubmitted) return;\n    const correct = selectedOption === correctAnswerId;\n    const startedAt = Date.now();\n    setConfidenceLevel(confidence);\n    setAnswerStartedAt(startedAt);\n    setCommittedAnswer(selectedOption);\n    setHasSubmitted(true);\n    setQuestionExpanded(false);\n    sessionStorage.setItem(getStorageKey(), JSON.stringify({ selectedOption, hasSubmitted: true }));\n    sessionStorage.setItem(`learning_frontier_${conceptTitle}_answer_confidence_${startedAt}`, JSON.stringify({\n      confidence,\n      conceptTitle,\n      questionId: question.id,\n      correct,\n      createdAt: startedAt,\n    }));\n    onAnswer(correct);\n    void runTutor(undefined, false, selectedOption, startedAt, undefined, false, confidence);\n    window.setTimeout(() => tutorRef.current?.scrollIntoView({ behavior: 'smooth', block: 'start' }), 180);\n  };'''
          s = s[:start] + new_handler + s[end:]

          old_ui = '''{!hasSubmitted && (\n              <button type="button" onClick={handleCheckAnswer} disabled={!selectedOption} className="mt-6 w-full rounded-full px-5 py-4 text-[15px] font-bold text-white transition disabled:cursor-not-allowed disabled:opacity-40" style={{ background: C.ink }}>\n                Check answer\n              </button>\n            )}'''
          new_ui = '''{!hasSubmitted && selectedOption && (\n              <div className="mt-6" aria-label="Answer confidence">\n                <div className="mb-3 text-center text-[15px] font-semibold" style={{ color: C.ink }}>How sure were you?</div>\n                <div className="grid grid-cols-3 gap-2">\n                  {(['knew', 'unsure', 'guessed'] as ConfidenceLevel[]).map((confidence) => (\n                    <button\n                      key={confidence}\n                      type="button"\n                      onClick={() => handleConfidenceSubmit(confidence)}\n                      className="rounded-full border px-3 py-3 text-[13px] font-semibold transition hover:-translate-y-px"\n                      style={{ borderColor: C.line, background: C.paper, color: C.ink }}\n                    >\n                      {confidence === 'knew' ? 'Knew it' : confidence === 'unsure' ? 'Unsure' : 'Guessed'}\n                    </button>\n                  ))}\n                </div>\n                <div className="mt-2 text-center text-[11px]" style={{ color: C.muted }}>Choose one to submit your answer.</div>\n              </div>\n            )}'''
          if old_ui not in s: raise SystemExit('Check answer UI anchor missing')
          s = s.replace(old_ui, new_ui, 1)

          if 'Check answer' in s: raise SystemExit('Check answer still present')
          p.write_text(s)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/components/practice/UkmlaSBAQuestion.tsx
          git commit -m "Submit SBA answer with inline confidence"
          git push