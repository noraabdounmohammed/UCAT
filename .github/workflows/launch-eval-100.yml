name: Launch Eval 100

on:
  workflow_dispatch:
  pull_request:
    branches: [master]

jobs:
  launch-eval-100:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Apply audited eval-only compiler, reviewer, and evidence-boundary guards
        run: python scripts/apply-launch-eval-guards.py
      - name: Apply run-18 upstream generator improvements
        run: python scripts/apply-run18-generator-improvements.py
      - name: Apply recurrent evidence/compiler improvements compatibly
        run: python scripts/apply-run24-compatible-evidence-improvements.py
      - name: Apply run-26 generation self-audit and fail-closed modifier guards
        run: python scripts/apply-run26-quality-improvements.py
      - name: Apply run-28 evidence-contract adherence improvements
        run: python scripts/apply-run28-constraint-adherence.py
      - name: Align run-30 evidence contracts with hardened launch gates
        run: python scripts/apply-run30-contract-alignment.py
      - name: Harden run-37 derived-score pass precision
        run: python scripts/apply-run37-pass-precision.py
      - name: Apply run-41 recurrent generation repairs
        run: python scripts/apply-run41-recurrent-generation-repairs.py
      - name: Run 100-question two-attempt launch evaluation
        run: node scripts/run-launch-eval-100.mjs
        env:
          STUDYEDIT_BASE_URL: https://studyedit.com
      - name: Upload 100-question launch eval reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: launch-eval-100-report
          path: |
            artifacts/launch-eval-100-report.json
            artifacts/launch-eval-100-replicate-*.json
            artifacts/launch-eval-100-replicate-*-attempt-*.json
          if-no-files-found: warn
